name: Build APK
on:
  push:
    paths: ['APK-Maker/input/**']
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    working-directory: APK-Maker
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: pip install pillow
      - name: Prepare app from input
        run: python3 tools/prepare.py
      - name: Build APK
        run: gradle assembleDebug --no-daemon -PappId=$APP_ID
      - uses: actions/upload-artifact@v4
        with: { name: app-apk, path: APK-Maker/app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: APK-Maker/app/build/outputs/apk/debug/app-debug.apk
